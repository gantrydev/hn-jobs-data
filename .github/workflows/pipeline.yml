name: HN Jobs Pipeline

on:
  schedule:
    - cron: "0 10 3 * *"  # 3rd of month — thread is posted on first weekday
    - cron: "0 10 28 * *" # 28th of month — catch late postings before month ends
  workflow_dispatch: # Manual trigger

concurrency:
  group: pipeline
  cancel-in-progress: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit JSON files
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec tsx scripts/run.ts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add runs/ indexes/ llms.txt
          git diff --staged --quiet || git commit -m "data: $(date -u +'%Y-%m-%d') pipeline run"
          git push

  # Deploy data to this repo's Pages so the site can fetch the fresh JSON.
  deploy-pages:
    needs: run-pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Check out the branch tip, not github.sha: run-pipeline just pushed a new
      # commit, and github.sha still points at the trigger commit (one run stale).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Stage deployable content
        run: |
          mkdir _site
          cp -r indexes _site/indexes
          cp -r runs _site/runs
          cp llms.txt _site/llms.txt

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # Only ping the site repo once the new data is live on Pages.
  trigger-site:
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.DISPATCH_APP_ID }}
          private-key: ${{ secrets.DISPATCH_APP_KEY }}
          owner: gantryops
          repositories: hn-jobs-site

      - name: Trigger site rebuild
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh api repos/gantryops/hn-jobs-site/dispatches -f event_type=data-updated

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Generate analytics
        run: pnpm analytics

      - name: Validate salary distributions
        run: |
          jq -e '
            .clusters | length > 0 and all(.[];
              .salary_sample_size == ([.salary_ranges[].count] | add) and
              [.salary_ranges[].band] == ["<$100k", "$100k-$150k", "$150k-$200k", "$200k+"] and
              if .salary_sample_size > 0 then
                ([.salary_ranges[].pct] | add) >= 99.8 and
                ([.salary_ranges[].pct] | add) <= 100.2
              else
                ([.salary_ranges[].pct] | add) == 0
              end
            )
          ' indexes/tech-clusters.json
